# Uninsulated historic masonry museum building configuration (5-zone ROM, Layer A).
# Shares the exact 5-zone floorplan and partition adjacency of 5ZoneAutoDXVAV_multizone.epJSON,
# isolating envelope leakage, heavyweight masonry thermal mass, single glazing, and strong
# hygroscopic plaster/timber moisture buffering.

schema_version: 1
tier: historic
description: >
  未保温历史砖石木构博物馆（5 区同平面几何）：
  无保温实心砖石外墙与老旧屋面、单层玻璃窗、高渗透换气次数（约 1.0 ACH），
  但具备高建筑蓄热体量（3.0 倍现代基线）与较高内饰灰泥/木作吸湿缓冲层。

constants:
  rho_air_kg_m3: 1.2041
  cp_air_j_kg_k: 1006.0
  solar_to_air_fraction: 0.20   # Greater share absorbed into heavyweight masonry surfaces
  internal_rad_fraction: 0.55
  person_sensible_w: 75.0
  person_latent_kg_s: 1.85e-5

envelope:
  u_wall_w_m2_k: 1.80           # Assumption: uninsulated ~0.45 m solid brick/stone historic masonry wall
  u_roof_w_m2_k: 1.35           # Assumption: uninsulated timber-framed historic roof / attic slab
  u_window_w_m2_k: 5.20         # Assumption: single-glazed historic wooden sash windows
  u_ground_w_m2_k: 0.75         # Assumption: uninsulated historic stone/timber floor over soil
  u_interzone_wall_w_m2_k: 1.30 # Assumption: thick solid masonry internal load-bearing partitions
  window_shgc: 0.76             # Assumption: clear single glazing high solar transmittance
  infiltration_ach_design: 1.00 # Assumption: leaky historic fenestration & envelope (~1.0 ACH)
  interzone_air_exchange_ach: 0.60 # Assumption: high open-doorway air mixing between historic rooms
  thermal_mass_multiplier: 3.0  # Assumption: heavyweight historic masonry (~3x modern concrete/drywall effective mass)
  moisture_buffer_multiplier: 2.32 # Effective MBV ratio relative to modern baseline (1.16 / 0.50)
  effective_mbv_g_m2_rh: 1.16   # Rode et al. (2005) Table 3-5: untreated spruce boards 3-lab mean (1.16), Good class

provenance:
  geometry_and_partitions: "src/museum/assets/5ZoneAutoDXVAV_multizone.epJSON (common 5-zone topology)"
  envelope_and_infiltration_tier: "assumption (uninsulated heavyweight historic masonry museum archetype)"
  hvac_efficiencies: "assumption (older/constrained heritage HVAC plant added to historic shell)"
  interzone_doorway_airflow: "assumption (symmetric open-portal air mixing)"
  thermal_capacitance: "assumption (3.0x thermal mass over modern baseline)"
  moisture_buffering: >
    Calibrated from exposed interior wall + partition + ceiling surface area x effective MBV
    using Rode (Ed.) et al. (2005), BYG-DTU Report R-126, Table 3-5 (p. 31) and Table 4-1 (p. 38),
    with 8 h NORDTEST cycle time constant tau_buffer_h = 8.0 h (Sec. 3.3, p. 28).

hvac:
  cop_cooling: 2.6              # Older or space-constrained DX/chiller retrofit COP (assumption)
  eta_heating: 0.85             # Existing boiler / hydronic heating delivery efficiency (assumption)
  eta_reheat: 0.95              # Reheat coil efficiency (assumption)
  eta_humidification: 0.90      # Steam humidifier efficiency (assumption)
  fan_w_per_w_sensible: 0.06    # Higher pressure drop / auxiliary fan fraction in retrofit ductwork (assumption)
  coil_approach_dt_c: 2.0
  q_heat_max_w_per_m2: 180.0    # Higher sizing allowance for uninsulated envelope heat loss
  q_cool_max_w_per_m2: 180.0
  m_hum_max_kg_s_per_m2: 2.5e-5
  m_dehum_max_kg_s_per_m2: 3.2e-5
  smooth_beta_t: 8.0
  smooth_beta_w: 8000.0
  electricity_primary_factor: 2.55
  electricity_co2_kg_per_kwh: 0.45

