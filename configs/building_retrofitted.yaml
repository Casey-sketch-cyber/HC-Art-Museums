# Retrofitted historic/existing museum building configuration (5-zone ROM, Layer A).
# Shares the exact 5-zone floorplan and partition adjacency of 5ZoneAutoDXVAV_multizone.epJSON,
# representing an existing masonry museum upgraded with interior insulation, double glazing,
# air-sealing, and modern HVAC equipment.

schema_version: 1
tier: retrofitted
description: >
  适度节能改造既有博物馆（5 区同平面几何）：
  外墙加设中等保温内衬或砂浆层、屋顶补充保温、更换双层低辐射窗，气密性中等，
  保留较大砖石热容与中等内饰吸湿缓冲能力。

constants:
  rho_air_kg_m3: 1.2041
  cp_air_j_kg_k: 1006.0
  solar_to_air_fraction: 0.25   # Slightly higher share absorbed by exposed interior mass
  internal_rad_fraction: 0.55
  person_sensible_w: 75.0
  person_latent_kg_s: 1.85e-5

envelope:
  u_wall_w_m2_k: 0.85           # Assumption: retrofitted brick/stone wall (~2-3 cm interior insulated lime/mineral board)
  u_roof_w_m2_k: 0.55           # Assumption: attic/roof retrofit insulation
  u_window_w_m2_k: 2.10         # Assumption: heritage secondary glazing or double low-E retrofit unit
  u_ground_w_m2_k: 0.55         # Assumption: uninsulated or edge-insulated heritage floor slab
  u_interzone_wall_w_m2_k: 1.45 # Assumption: plastered masonry interior partitions
  window_shgc: 0.55             # Assumption: moderate SHGC solar control glass
  infiltration_ach_design: 0.45 # Assumption: air-sealed historic sash/doors (~0.45 ACH)
  interzone_air_exchange_ach: 0.45 # Assumption: open gallery portals between perimeter rooms and central hall
  thermal_mass_multiplier: 1.8  # Assumption: thicker masonry core relative to lightweight drywall modern archetype
  moisture_buffer_multiplier: 1.52 # Effective MBV ratio relative to modern baseline (0.76 / 0.50)
  effective_mbv_g_m2_rh: 0.76   # Rode et al. (2005) Table 3-5: LW aggregate concrete with stucco 3-lab mean (0.76)
  oa_flow_per_person_m3_s: 0.0038  # ASHRAE Standard 62.1-2022 Table 6-1, Museums/galleries: R_p = 3.8 L/(s*person)
  oa_flow_per_area_m3_s_m2: 0.0003 # ASHRAE Standard 62.1-2022 Table 6-1, Museums/galleries: R_a = 0.3 L/(s*m2)

provenance:
  geometry_and_partitions: "src/museum/assets/5ZoneAutoDXVAV_multizone.epJSON (common 5-zone topology)"
  envelope_and_infiltration_tier: "assumption (retrofitted existing masonry museum archetype)"
  mechanical_ventilation: "ASHRAE Standard 62.1-2022 Table 6-1, Museums/galleries (R_p = 3.8 L/(s*person), R_a = 0.3 L/(s*m2))"
  hvac_efficiencies: "assumption (retrofitted hydronic/DX HVAC equipment)"
  interzone_doorway_airflow: "assumption (symmetric doorway air mixing)"
  thermal_capacitance: "assumption (1.8x thermal mass over modern baseline)"
  moisture_buffering: >
    Calibrated from exposed interior wall + partition + ceiling surface area x effective MBV
    using Rode (Ed.) et al. (2005), BYG-DTU Report R-126, Table 3-5 (p. 31) and Table 4-1 (p. 38),
    with 8 h NORDTEST cycle time constant tau_buffer_h = 8.0 h (Sec. 3.3, p. 28).

hvac:
  cop_cooling: 2.9
  eta_heating: 0.90
  eta_reheat: 0.98
  eta_humidification: 0.92
  fan_w_per_w_sensible: 0.05
  coil_approach_dt_c: 2.0
  q_heat_max_w_per_m2: 140.0
  q_cool_max_w_per_m2: 150.0
  m_hum_max_kg_s_per_m2: 1.8e-5
  m_dehum_max_kg_s_per_m2: 2.4e-5
  smooth_beta_t: 8.0
  smooth_beta_w: 8000.0
  electricity_primary_factor: 2.55
  electricity_co2_kg_per_kwh: 0.45

