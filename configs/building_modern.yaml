interzone_partitions:
  # Exact interior partition surface areas [m2] extracted from 5ZoneAutoDXVAV_multizone.epJSON
  - zones: [SPACE1-1, SPACE2-1]
    area_m2: 12.56
  - zones: [SPACE1-1, SPACE4-1]
    area_m2: 12.56
  - zones: [SPACE2-1, SPACE3-1]
    area_m2: 12.38
  - zones: [SPACE3-1, SPACE4-1]
